<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1030"/>
      <stop offset="70%" stop-color="#23204e"/>
      <stop offset="100%" stop-color="#3b2d5e"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffb45c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb45c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#nightsky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="120" cy="90" r="2.5"/><circle cx="340" cy="160" r="2"/><circle cx="520" cy="70" r="2.5"/>
    <circle cx="900" cy="120" r="2"/><circle cx="1100" cy="60" r="2.5"/><circle cx="1320" cy="150" r="2"/>
    <circle cx="1500" cy="90" r="2.5"/><circle cx="700" cy="180" r="2"/><circle cx="240" cy="240" r="2"/>
    <circle cx="1430" cy="260" r="2"/>
  </g>
  <!-- firework -->
  <circle cx="1100" cy="230" r="170" fill="url(#burst)"/>
  <g stroke="#ffd98a" stroke-width="4" stroke-linecap="round">
    <line x1="1100" y1="230" x2="1100" y2="110"/><line x1="1100" y1="230" x2="1100" y2="350"/>
    <line x1="1100" y1="230" x2="980" y2="230"/><line x1="1100" y1="230" x2="1220" y2="230"/>
    <line x1="1100" y1="230" x2="1015" y2="145"/><line x1="1100" y1="230" x2="1185" y2="145"/>
    <line x1="1100" y1="230" x2="1015" y2="315"/><line x1="1100" y1="230" x2="1185" y2="315"/>
  </g>
  <g fill="#ff8a5c">
    <circle cx="1100" cy="105" r="6"/><circle cx="1100" cy="355" r="6"/><circle cx="975" cy="230" r="6"/>
    <circle cx="1225" cy="230" r="6"/><circle cx="1010" cy="140" r="6"/><circle cx="1190" cy="140" r="6"/>
    <circle cx="1010" cy="320" r="6"/><circle cx="1190" cy="320" r="6"/>
  </g>
  <!-- rooftops -->
  <g fill="#11122b">
    <rect x="0" y="600" width="280" height="300"/>
    <polygon points="0,600 140,520 280,600"/>
    <rect x="320" y="650" width="240" height="250"/>
    <rect x="1320" y="620" width="280" height="280"/>
    <polygon points="1320,620 1460,540 1600,620"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffcf7d" opacity="0.85">
    <rect x="60" y="660" width="30" height="40"/><rect x="160" y="700" width="30" height="40"/>
    <rect x="380" y="700" width="30" height="40"/><rect x="470" y="740" width="30" height="40"/>
    <rect x="1380" y="680" width="30" height="40"/><rect x="1480" y="720" width="30" height="40"/>
  </g>
  <!-- ground -->
  <rect y="820" width="1600" height="80" fill="#0a0a1c"/>
</svg>
