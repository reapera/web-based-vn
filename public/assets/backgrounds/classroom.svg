<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#e8e0d0"/>
  <!-- back wall -->
  <rect width="1600" height="620" fill="#d9cfb8"/>
  <!-- floor -->
  <rect y="620" width="1600" height="280" fill="#b59a72"/>
  <g stroke="#9c7f58" stroke-width="4">
    <line x1="0" y1="690" x2="1600" y2="690"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="860" x2="1600" y2="860"/>
  </g>
  <!-- chalkboard -->
  <rect x="560" y="120" width="620" height="300" rx="10" fill="#2f5e46" stroke="#8a6d44" stroke-width="14"/>
  <line x1="620" y1="190" x2="980" y2="190" stroke="#cfe8d8" stroke-width="6" opacity="0.5"/>
  <line x1="620" y1="250" x2="1100" y2="250" stroke="#cfe8d8" stroke-width="6" opacity="0.35"/>
  <line x1="620" y1="310" x2="900" y2="310" stroke="#cfe8d8" stroke-width="6" opacity="0.4"/>
  <!-- windows -->
  <g>
    <rect x="80" y="120" width="300" height="340" rx="8" fill="#bfe3f2" stroke="#fff" stroke-width="12"/>
    <line x1="230" y1="120" x2="230" y2="460" stroke="#fff" stroke-width="10"/>
    <line x1="80" y1="290" x2="380" y2="290" stroke="#fff" stroke-width="10"/>
    <circle cx="150" cy="190" r="34" fill="#fff" opacity="0.7"/>
    <circle cx="190" cy="180" r="26" fill="#fff" opacity="0.6"/>
  </g>
  <g>
    <rect x="1240" y="120" width="280" height="340" rx="8" fill="#bfe3f2" stroke="#fff" stroke-width="12"/>
    <line x1="1380" y1="120" x2="1380" y2="460" stroke="#fff" stroke-width="10"/>
    <line x1="1240" y1="290" x2="1520" y2="290" stroke="#fff" stroke-width="10"/>
  </g>
  <!-- desks -->
  <g fill="#caa468" stroke="#9c7f58" stroke-width="5">
    <rect x="140" y="640" width="260" height="26" rx="6"/>
    <rect x="170" y="666" width="18" height="120"/>
    <rect x="352" y="666" width="18" height="120"/>
    <rect x="1200" y="640" width="260" height="26" rx="6"/>
    <rect x="1230" y="666" width="18" height="120"/>
    <rect x="1412" y="666" width="18" height="120"/>
  </g>
</svg>
