<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9e8ff"/>
      <stop offset="100%" stop-color="#f0f8ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a87a"/>
      <stop offset="100%" stop-color="#8b6340"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#e8ddd0"/>
    </linearGradient>
    <linearGradient id="window_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff3cc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff9e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="locker_l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a5f8a"/>
      <stop offset="100%" stop-color="#5580aa"/>
    </linearGradient>
    <linearGradient id="locker_r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5580aa"/>
      <stop offset="100%" stop-color="#3a5f8a"/>
    </linearGradient>
    <filter id="soft_glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Perspective floor tiles -->
    <pattern id="tiles" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="none" stroke="#a0784a" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Sky / ceiling -->
  <rect width="1280" height="720" fill="url(#wall)"/>

  <!-- Ceiling -->
  <rect x="0" y="0" width="1280" height="120" fill="#ddd3c4"/>
  <rect x="0" y="115" width="1280" height="8" fill="#c5b5a2"/>

  <!-- Ceiling lights -->
  <rect x="300" y="20" width="120" height="20" rx="4" fill="#fffde7" opacity="0.9" filter="url(#soft_glow)"/>
  <rect x="860" y="20" width="120" height="20" rx="4" fill="#fffde7" opacity="0.9" filter="url(#soft_glow)"/>
  <rect x="580" y="20" width="120" height="20" rx="4" fill="#fffde7" opacity="0.95" filter="url(#soft_glow)"/>

  <!-- Far wall -->
  <rect x="380" y="120" width="520" height="420" fill="#ede4d8"/>

  <!-- Far window -->
  <rect x="460" y="150" width="360" height="300" rx="4" fill="url(#sky)"/>
  <!-- Window frame -->
  <rect x="460" y="150" width="360" height="300" rx="4" fill="none" stroke="#c8b89a" stroke-width="6"/>
  <line x1="640" y1="150" x2="640" y2="450" stroke="#c8b89a" stroke-width="4"/>
  <line x1="460" y1="300" x2="820" y2="300" stroke="#c8b89a" stroke-width="4"/>
  <!-- Window light rays on floor -->
  <polygon points="460,450 820,450 900,600 380,600" fill="url(#window_light)" opacity="0.5"/>

  <!-- Outside scene through window: sky + trees -->
  <rect x="464" y="154" width="352" height="142" fill="#b8dcf8"/>
  <rect x="464" y="296" width="352" height="150" fill="#7dc87a"/>
  <!-- Trees -->
  <ellipse cx="510" cy="290" rx="36" ry="50" fill="#4a9e4a"/>
  <ellipse cx="560" cy="280" rx="28" ry="40" fill="#3d8c3d"/>
  <ellipse cx="740" cy="285" rx="32" ry="46" fill="#4a9e4a"/>
  <ellipse cx="790" cy="275" rx="26" ry="38" fill="#3d8c3d"/>
  <!-- Clouds -->
  <ellipse cx="540" cy="200" rx="45" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="580" cy="195" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="720" cy="215" rx="38" ry="16" fill="white" opacity="0.8"/>

  <!-- Left wall -->
  <polygon points="0,120 380,120 380,540 0,720" fill="#e8dece"/>
  <!-- Left lockers -->
  <g fill="url(#locker_l)">
    <rect x="20" y="160" width="60" height="160" rx="3"/>
    <rect x="88" y="160" width="60" height="160" rx="3"/>
    <rect x="156" y="160" width="60" height="160" rx="3"/>
    <rect x="224" y="160" width="60" height="160" rx="3"/>
    <rect x="292" y="160" width="60" height="160" rx="3"/>
  </g>
  <!-- Locker handles and lines -->
  <g fill="none" stroke="#2a4f7a" stroke-width="1" opacity="0.6">
    <line x1="20" y1="240" x2="80" y2="240"/>
    <line x1="88" y1="240" x2="148" y2="240"/>
    <line x1="156" y1="240" x2="216" y2="240"/>
    <line x1="224" y1="240" x2="284" y2="240"/>
    <line x1="292" y1="240" x2="352" y2="240"/>
  </g>
  <g fill="#1a3f6a">
    <circle cx="72" cy="200" r="4"/>
    <circle cx="140" cy="200" r="4"/>
    <circle cx="208" cy="200" r="4"/>
    <circle cx="276" cy="200" r="4"/>
    <circle cx="344" cy="200" r="4"/>
  </g>

  <!-- Right wall -->
  <polygon points="1280,120 900,120 900,540 1280,720" fill="#e8dece"/>
  <!-- Right lockers -->
  <g fill="url(#locker_r)">
    <rect x="928" y="160" width="60" height="160" rx="3"/>
    <rect x="996" y="160" width="60" height="160" rx="3"/>
    <rect x="1064" y="160" width="60" height="160" rx="3"/>
    <rect x="1132" y="160" width="60" height="160" rx="3"/>
    <rect x="1200" y="160" width="60" height="160" rx="3"/>
  </g>
  <g fill="none" stroke="#2a4f7a" stroke-width="1" opacity="0.6">
    <line x1="928" y1="240" x2="988" y2="240"/>
    <line x1="996" y1="240" x2="1056" y2="240"/>
    <line x1="1064" y1="240" x2="1124" y2="240"/>
    <line x1="1132" y1="240" x2="1192" y2="240"/>
    <line x1="1200" y1="240" x2="1260" y2="240"/>
  </g>
  <g fill="#1a3f6a">
    <circle cx="936" cy="200" r="4"/>
    <circle cx="1004" cy="200" r="4"/>
    <circle cx="1072" cy="200" r="4"/>
    <circle cx="1140" cy="200" r="4"/>
    <circle cx="1208" cy="200" r="4"/>
  </g>

  <!-- Floor -->
  <polygon points="0,720 380,540 900,540 1280,720" fill="url(#floor)"/>
  <!-- Floor tile lines (perspective) -->
  <g stroke="#9a7040" stroke-width="1" opacity="0.35">
    <!-- Horizontal lines -->
    <line x1="0" y1="720" x2="1280" y2="720"/>
    <line x1="280" y1="630" x2="1000" y2="630"/>
    <line x1="330" y1="580" x2="950" y2="580"/>
    <line x1="355" y1="558" x2="925" y2="558"/>
    <!-- Vertical lines (converging to vanishing point at 640,540) -->
    <line x1="640" y1="540" x2="0" y2="720"/>
    <line x1="640" y1="540" x2="200" y2="720"/>
    <line x1="640" y1="540" x2="400" y2="720"/>
    <line x1="640" y1="540" x2="600" y2="720"/>
    <line x1="640" y1="540" x2="680" y2="720"/>
    <line x1="640" y1="540" x2="880" y2="720"/>
    <line x1="640" y1="540" x2="1080" y2="720"/>
    <line x1="640" y1="540" x2="1280" y2="720"/>
  </g>

  <!-- Wall/floor seam shadow -->
  <line x1="0" y1="720" x2="380" y2="540" stroke="#7a5830" stroke-width="3" opacity="0.5"/>
  <line x1="900" y1="540" x2="1280" y2="720" stroke="#7a5830" stroke-width="3" opacity="0.5"/>

  <!-- Ambient light overlay -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#window_light)" opacity="0.15"/>
</svg>
